parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # ✅ Gemini Service bien indenté
    App\Service\GeminiRecommandationService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'

    App\Service\DepenseAnalyseService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $ollamaUrl: '%env(OLLAMA_URL)%'
