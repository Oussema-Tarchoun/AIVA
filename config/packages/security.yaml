security:
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_profiler|_wdt|assets|build)/
      security: false

    main:
      lazy: true
      provider: app_user_provider

      # Symfony redirige automatiquement vers login
      entry_point: App\Security\AppAuthenticator

      # Authenticator custom
      custom_authenticator: App\Security\AppAuthenticator

      # Page login
      form_login:
        login_path: app_login
        check_path: app_login

      # Si accès refusé → redirect login
      access_denied_url: app_login

      logout:
        path: app_logout


  access_control:

    # ✅ Pages publiques
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/reset-password, roles: PUBLIC_ACCESS }

    # ✅ Nutrition pages (ROLE_USER obligatoire)
    - { path: ^/nutrition, roles: ROLE_USER }

    # ✅ Dashboard "/" ADMIN ONLY
    - { path: ^/$, roles: ROLE_ADMIN }

    # ✅ ADMIN ONLY routes
    - { path: ^/energie, roles: ROLE_ADMIN }
    - { path: ^/recommandations, roles: ROLE_ADMIN }
    - { path: ^/stateenergi, roles: ROLE_ADMIN }

    - { path: ^/user, roles: ROLE_ADMIN }
    - { path: ^/chapitre, roles: ROLE_ADMIN }
    - { path: ^/cours, roles: ROLE_ADMIN }

    - { path: ^/aliment, roles: ROLE_ADMIN }
    - { path: ^/repas, roles: ROLE_ADMIN }

    - { path: ^/depense, roles: ROLE_ADMIN }
    - { path: ^/categorie, roles: ROLE_ADMIN }

    # ✅ Tout le reste nécessite ROLE_USER
    - { path: ^/, roles: ROLE_USER }


when@test:
  security:
    password_hashers:
      App\Entity\User:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
